<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormPilot Test Page - Comprehensive</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; padding: 2rem; max-width: 800px; margin: 0 auto; color: #111827; }
    h1 { margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
    input[type="text"], input[type="email"], input[type="tel"], select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 1rem; }
    fieldset { border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 1rem; margin-bottom: 1.5rem; }
    legend { font-weight: 600; padding: 0 0.5rem; }
    .flex-row { display: flex; gap: 1rem; }
    .flex-1 { flex: 1; }
    .mt-4 { margin-top: 1rem; }
    .hidden { display: none; }
    button { padding: 0.75rem 1.5rem; background-color: #4f46e5; color: white; border: none; border-radius: 0.375rem; font-weight: 500; cursor: pointer; }
    button:hover { background-color: #4338ca; }
  </style>
</head>
<body>
  <h1>Fictional Job Application Form</h1>
  <p>Test page for FormPilot extension containing all required field types.</p>
  
  <form id="test-form" onsubmit="event.preventDefault(); alert('Form submitted!');">
    
    <fieldset>
      <legend>Personal Details</legend>
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="first-name">First Name <span style="color: red;">*</span></label>
          <input type="text" id="first-name" name="firstName" required>
        </div>
        <div class="form-group flex-1">
          <label for="last-name">Last Name <span style="color: red;">*</span></label>
          <input type="text" id="last-name" name="lastName" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="text" id="dob" name="dateOfBirth" placeholder="MM/DD/YYYY">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div>
          <label style="display: inline; font-weight: normal;"><input type="radio" name="gender" value="Male"> Male</label>
          <label style="display: inline; font-weight: normal; margin-left: 1rem;"><input type="radio" name="gender" value="Female"> Female</label>
          <label style="display: inline; font-weight: normal; margin-left: 1rem;"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact & Address</legend>
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="email">Email Address <span style="color: red;">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group flex-1">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
        </div>
      </div>

      <div class="form-group">
        <label for="street">Street Address</label>
        <input type="text" id="street" name="address1">
      </div>
      
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="city">City</label>
          <input type="text" id="city" name="city">
        </div>
        <div class="form-group flex-1">
          <label for="state">State</label>
          <select id="state" name="state">
            <option value="">Select State...</option>
            <option value="CA">California</option>
            <option value="NY">New York</option>
            <option value="TX">Texas</option>
            <option value="WA">Washington</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="zip">Zip / Postal Code</label>
          <input type="text" id="zip" name="zip">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Education</legend>
      <div class="form-group">
        <label for="university">Institution Name</label>
        <input type="text" id="university" name="institutionName">
      </div>
      <div class="form-group">
        <label for="degree">Degree / Qualification</label>
        <input type="text" id="degree" name="degree">
      </div>
    </fieldset>

    <fieldset>
      <legend>Edge Cases (Unsupported, Read-only, Pre-filled)</legend>
      <div class="form-group">
        <label for="prefilled">Pre-filled Field (Should show warning before overwrite)</label>
        <input type="text" id="prefilled" name="prefilledField" value="Existing Value">
      </div>
      <div class="form-group">
        <label for="readonly-field">System ID (Read Only)</label>
        <input type="text" id="readonly-field" name="sysId" value="SYS-9901-XYZ" readonly>
      </div>
      <div class="form-group">
        <label for="disabled-field">Disabled Input</label>
        <input type="text" id="disabled-field" name="disabledInput" value="Cannot edit" disabled>
      </div>
      <div class="form-group">
        <label for="password">Password (Should be ignored by FormPilot autofill)</label>
        <input type="password" id="password" name="password">
      </div>
      <div class="form-group">
        <label for="credit-card">Credit Card (Should be excluded/ignored)</label>
        <input type="text" id="credit-card" name="ccNumber" placeholder="XXXX-XXXX-XXXX-XXXX">
      </div>
      <input type="hidden" name="csrf_token" value="abc123hidden">
    </fieldset>
    
    <fieldset>
      <legend>Consents & Dynamics</legend>
      <div class="form-group">
        <label style="font-weight: normal; font-size: 0.875rem; display: flex; align-items: start; gap: 0.5rem;">
          <input type="checkbox" id="terms" name="terms" required style="margin-top: 0.25rem;">
          I agree to the Terms of Service and Privacy Policy. (Should not be autofilled)
        </label>
      </div>
      
      <div class="form-group" id="dynamic-container">
        <button type="button" onclick="addDynamicField()" style="background-color: #10b981; padding: 0.5rem 1rem;">Add Dynamic Custom Field</button>
      </div>
    </fieldset>

    <button type="submit">Submit Application</button>
  </form>

  <script>
    function addDynamicField() {
      const container = document.getElementById('dynamic-container');
      const div = document.createElement('div');
      div.className = 'form-group mt-4';
      const id = 'dyn-' + Math.random().toString(36).substr(2, 5);
      div.innerHTML = \`
        <label for="\${id}">Dynamic Field (e.g., Portfolio URL)</label>
        <input type="text" id="\${id}" name="\${id}" placeholder="https://...">
      \`;
      container.appendChild(div);
    }
  </script>
</body>
</html>
